<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>N.N Creation's | হোমমেড কেক ও স্ন্যাক্স</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', 'Noto Sans Bengali', 'Segoe UI', sans-serif; }

    body {
      background: linear-gradient(180deg, #ffeef8 0%, #fff4e6 50%, #e8f8ff 100%);
      color: #2d1b36;
      padding-bottom: 45px;
    }

    header {
      background: linear-gradient(135deg, #ff3e7f, #ff8a3d, #a838ff);
      color: #ffffff;
      text-align: center;
      padding: 30px 16px 26px;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      box-shadow: 0 8px 20px rgba(255, 62, 127, 0.3);
    }
    header h1 { font-size: 25px; font-weight: 800; margin-bottom: 8px; }
    header p {
      font-size: 13px;
      background: rgba(255, 255, 255, 0.22);
      display: inline-block;
      padding: 7px 14px;
      border-radius: 20px;
      line-height: 1.5;
    }

    .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

    .badge-info {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #7c2ae8;
      background: #f3e8ff;
      padding: 10px 12px;
      border-radius: 14px;
      margin-bottom: 18px;
      border: 1px dashed #c084fc;
      line-height: 1.5;
    }

    .cake-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .card {
      background: #ffffff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(168, 56, 255, 0.12);
      border: 2px solid #ffd6e7;
    }

    .viewer-box {
      position: relative;
      width: 100%;
      height: 235px;
      background: radial-gradient(circle, #fff0f6 0%, #ffe3ec 100%);
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    .tag-360 {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #7c2ae8, #ff3e7f);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 20px;
      pointer-events: none;
    }

    .card-body {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: linear-gradient(90deg, #ffffff, #fff9fc);
    }
    .cake-info h3 { font-size: 17px; font-weight: 800; color: #2d1b36; margin-bottom: 4px; }
    .cake-info p { font-size: 13px; color: #ff3e7f; font-weight: 600; }

    .price-btn {
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      padding: 12px 18px;
      border-radius: 14px;
      white-space: nowrap;
      box-shadow: 0 5px 15px rgba(37, 211, 102, 0.35);
    }
    .price-btn:active { transform: scale(0.95); }

    footer {
      text-align: center;
      font-size: 12px;
      color: #6b5b7b;
      margin-top: 30px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎂 N.N Creation's</h1>
    <p>সম্পূর্ণ হোমমেড চকলেট কেক, কাপকেক, রসমলাই কেক, পিৎজা ও মোমো</p>
  </header>

  <div class="container">
    <div class="badge-info">👆 আঙুল দিয়ে সোয়াইপ করে ৩৬০° ঘুরিয়ে দেখুন • দামের ওপর চাপ দিয়ে হোয়াটসঅ্যাপে অর্ডার করুন</div>
    <div class="cake-grid" id="itemList"></div>
  </div>

  <footer>
    ✨ ফ্রেশ হোমমেড স্বাদ • সরাসরি হোয়াটসঅ্যাপে অর্ডার
  </footer>

  <script>
    // ১. এখানে আপনার হোয়াটসঅ্যাপ নম্বর দিন (880 সহ, + ছাড়া)
    const whatsappNumber = "8801XXXXXXXXX";

    // ২. এখানে আইটেমের নাম, বিবরণ, দাম, ৩ডি (.glb) লিংক ও ছবির লিংক পরিবর্তন করতে পারবেন
    const items = [
      {
        name: "হোমমেড চকলেট কেক",
        details: "রিচ কোকো • ফ্রেশ ক্রিম",
        price: "৳৯৫০",
        model3d: "https://modelviewer.dev/shared-assets/models/Astronaut.glb",
        poster: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=600&q=80"
      },
      {
        name: "হোমমেড কাপকেক",
        details: "৬ পিসের বক্স • নরম ও ফ্রস্টিং",
        price: "৳৬৫০",
        model3d: "https://modelviewer.dev/shared-assets/models/Astronaut.glb",
        poster: "https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=600&q=80"
      },
      {
        name: "রসমলাই কেক",
        details: "দেশি ফিউশন • ক্রিমি স্পঞ্জ",
        price: "৳১,১৫০",
        model3d: "https://modelviewer.dev/shared-assets/models/Astronaut.glb",
        poster: "https://images.unsplash.com/photo-1586788680434-30d324b2d46f?w=600&q=80"
      },
      {
        name: "হোমমেড পিৎজা",
        details: "চিজি টপিং • ফ্রেশ বেজ",
        price: "৳৫৫০",
        model3d: "https://modelviewer.dev/shared-assets/models/Astronaut.glb",
        poster: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600&q=80"
      },
      {
        name: "হোমমেড মোমো",
        details: "স্টিমড / ফ্রায়েড • স্পাইসি ডিপ",
        price: "৳৩২০",
        model3d: "https://modelviewer.dev/shared-assets/models/Astronaut.glb",
        poster: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=600&q=80"
      }
    ];

    const itemList = document.getElementById("itemList");

    items.forEach(item => {
      const message = encodeURIComponent(
        `আসসালামু আলাইকুম! আমি এই আইটেমটি অর্ডার করতে চাই:\n\n` +
        `🍽️ আইটেম: ${item.name} (${item.details})\n` +
        `💰 দাম: ${item.price}\n\n` +
        `ডেলিভারি ও অর্ডার বিস্তারিত জানাবেন অনুগ্রহ করে।`
      );
      const waLink = `https://wa.me/${whatsappNumber}?text=${message}`;

      itemList.innerHTML += `
        <div class="card">
          <div class="viewer-box">
            <span class="tag-360">🔄 ৩৬০° ভিউ</span>
            <model-viewer 
              src="${item.model3d}" 
              poster="${item.poster}"
              alt="${item.name}"
              auto-rotate 
              camera-controls 
              touch-action="pan-y"
              shadow-intensity="1">
            </model-viewer>
          </div>
          <div class="card-body">
            <div class="cake-info">
              <h3>${item.name}</h3>
              <p>${item.details}</p>
            </div>
            <a href="${waLink}" target="_blank" class="price-btn">
              ${item.price} ➔
            </a>
          </div>
        </div>
      `;
    });
  </script>

</body>
</html>
